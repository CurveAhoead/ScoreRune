name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile package
        run: python -m compileall scorerune
      - name: Smoke-run CLI
        run: |
          python -m scorerune validate -r examples/rubric.json -c examples/candidates.json
          python -m scorerune rank -r examples/rubric.json -c examples/candidates.json -f json

  dotnet:
