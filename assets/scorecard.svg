<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"
     aria-label="ScoreRune animated scorecard banner">
  <title>ScoreRune scorecard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a4a"/>
      <stop offset="1" stop-color="#160c2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#b388ff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="640" height="6" fill="url(#gold)"/>

  <text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="42"
        fill="#f6d365" font-weight="bold">ScoreRune</text>
  <text x="42" y="98" font-family="Georgia, serif" font-size="16" fill="#b388ff"
        letter-spacing="3">DETERMINISTIC RUBRIC ENGINE</text>

  <!-- Animated weighted bars, one per criterion -->
  <g font-family="Georgia, serif" font-size="14" fill="#e8dcff">
    <text x="40" y="150">acknowledges-issue</text>
    <rect x="230" y="138" width="360" height="16" rx="8" fill="#3a2a5e"/>
    <rect x="230" y="138" width="0" height="16" rx="8" fill="url(#violet)">
      <animate attributeName="width" from="0" to="360" dur="1.6s"
               begin="0s" fill="freeze" calcMode="spline"
               keySplines="0.2 0.7 0.3 1" keyTimes="0;1" values="0;360"/>
    </rect>

    <text x="40" y="192">provides-next-steps</text>
    <rect x="230" y="180" width="360" height="16" rx="8" fill="#3a2a5e"/>
    <rect x="230" y="180" width="0" height="16" rx="8" fill="url(#violet)">
      <animate attributeName="width" from="0" to="360" dur="1.6s"
               begin="0.2s" fill="freeze" calcMode="spline"
               keySplines="0.2 0.7 0.3 1" keyTimes="0;1" values="0;360"/>
    </rect>

    <text x="40" y="234">length-window</text>
    <rect x="230" y="222" width="360" height="16" rx="8" fill="#3a2a5e"/>
    <rect x="230" y="222" width="0" height="16" rx="8" fill="url(#gold)">
      <animate attributeName="width" from="0" to="180" dur="1.6s"
               begin="0.4s" fill="freeze" calcMode="spline"
               keySplines="0.2 0.7 0.3 1" keyTimes="0;1" values="0;180"/>
    </rect>

    <text x="40" y="276">readable-structure</text>
    <rect x="230" y="264" width="360" height="16" rx="8" fill="#3a2a5e"/>
    <rect x="230" y="264" width="0" height="16" rx="8" fill="url(#violet)">
      <animate attributeName="width" from="0" to="360" dur="1.6s"
               begin="0.6s" fill="freeze" calcMode="spline"
               keySplines="0.2 0.7 0.3 1" keyTimes="0;1" values="0;360"/>
    </rect>
  </g>

  <!-- Total badge with a pulsing gold ring -->
  <g transform="translate(560,60)">
    <circle r="34" fill="none" stroke="url(#gold)" stroke-width="4">
      <animate attributeName="r" values="30;34;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif"
          font-size="20" font-weight="bold" fill="#f6d365">90%</text>
  </g>
</svg>

