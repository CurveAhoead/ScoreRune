<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img"
     aria-label="ScoreRune animated pipeline diagram">
  <title>ScoreRune pipeline</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1136"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3fb0"/>
      <stop offset="1" stop-color="#3a2a5e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f6d365"/></marker>
  </defs>

  <rect width="720" height="240" fill="url(#pbg)"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="18" fill="#f6d365"
        letter-spacing="2">SCORING PIPELINE</text>

  <!-- Stages -->
  <g font-family="Georgia, serif" font-size="13" fill="#efe6ff" text-anchor="middle">
    <g transform="translate(60,110)">
      <rect x="-52" y="-30" width="104" height="60" rx="10" fill="url(#node)" stroke="#b388ff"/>
      <text y="-4">Rubric +</text><text y="14">Candidate</text>
    </g>
    <g transform="translate(240,110)">
      <rect x="-52" y="-30" width="104" height="60" rx="10" fill="url(#node)" stroke="#b388ff"/>
      <text y="-4">Per-criterion</text><text y="14">scorers</text>
    </g>
    <g transform="translate(420,110)">
      <rect x="-52" y="-30" width="104" height="60" rx="10" fill="url(#node)" stroke="#b388ff"/>
      <text y="-4">Weighted</text><text y="14">combine</text>
    </g>
    <g transform="translate(620,110)">
      <rect x="-58" y="-30" width="116" height="60" rx="10" fill="url(#node)" stroke="#f6d365"/>
      <text y="-4">Scorecard /</text><text y="14">Ranking</text>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="#f6d365" stroke-width="2" fill="none">
    <line x1="112" y1="110" x2="180" y2="110" marker-end="url(#arrow)"/>
    <line x1="292" y1="110" x2="360" y2="110" marker-end="url(#arrow)"/>
    <line x1="472" y1="110" x2="554" y2="110" marker-end="url(#arrow)"/>
  </g>

  <!-- Travelling token that flows along the pipeline -->
  <circle r="6" fill="#f6d365">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M60,110 L240,110 L420,110 L620,110" keyPoints="0;0.33;0.66;1"
      keyTimes="0;0.33;0.66;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.1;0.5;0.9;1"
             dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="360" y="210" text-anchor="middle" font-family="Georgia, serif"
        font-size="12" fill="#9a86d6">deterministic · dependency-free · Python + .NET parity</text>
</svg>
