[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorerune"
version = "1.0.0"
description = "Deterministic rubric engine for AI response review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ScoreRune contributors" }]
keywords = ["rubric", "scoring", "evaluation", "cli", "deterministic"]

[project.scripts]
scorerune = "scorerune.cli:main"

[tool.setuptools]
packages = ["scorerune"]

